<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Investment Demo Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #222;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .demo {
            display: inline-block;
            background: #facc15;
            color: #111;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .notice {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="demo">DEMO ONLY</div>

        <h1>Investment Demo</h1>

        <p class="notice">
            This is a demonstration website. No real money or investment accounts are involved.
        </p>

        <form onsubmit="loginDemo(event)">

            <input
                type="email"
                placeholder="Demo Email"
                required
            >

            <input
                type="password"
                placeholder="Demo Password"
                required
            >

            <button type="submit">
                Login to Demo
            </button>

        </form>

        <p class="footer">
            DEMO ONLY — NO REAL MONEY
        </p>

    </div>

    <script>
        function loginDemo(event) {
            event.preventDefault();

            window.location.href = "dashboard.html";
        }
    </script>

</body>

</html>
