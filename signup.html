<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Investment Account</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            width: 50px;
            height: 50px;
            background: #16a34a;
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #16a34a;
        }

        button {
            width: 100%;
            background: #16a34a;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #667085;
        }

        .links a {
            color: #16a34a;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .notice {
            margin-top: 22px;
            padding: 10px;
            background: #fff3cd;
            color: #664d03;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #98a2b3;
            font-size: 11px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="signup-box">

        <div class="logo">
            GKB
        </div>

        <h1>Create Account</h1>

        <div class="subtitle">
            Create your account to get started
        </div>

        <div id="message" class="message"></div>

        <form onsubmit="createAccount(event)">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                required
            >

            <button type="submit" id="signupButton">
                Create Account
            </button>

        </form>

        <div class="links">

            Already have an account?

            <a href="login.html">
                Log In
            </a>

        </div>

        <div class="notice">
            Investment account website
        </div>

        <footer>
            © 2026 Gerica Kathleen Bright
        </footer>

    </div>

    <script>

        const SUPABASE_URL =
            "https://uvpvieyklihsgjzxzwkz.supabase.co";

        const SUPABASE_KEY =
            "YOUR_NEW_PUBLISHABLE_KEY";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        function showMessage(message, type) {

            const box =
                document.getElementById("message");

            box.textContent = message;

            box.className =
                "message " + type;

            box.style.display = "block";

        }


        async function createAccount(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const button =
                document.getElementById("signupButton");


            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }


            button.disabled = true;

            button.textContent =
                "Creating Account...";


            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,
                    password: password

                });


            if (error) {

                button.disabled = false;

                button.textContent =
                    "Create Account";

                showMessage(
                    error.message,
                    "error"
                );

                return;

            }


            showMessage(
                "Account created successfully. Check your email if confirmation is required.",
                "success"
            );


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 2500);

        }

    </script>

</body>

</html>
