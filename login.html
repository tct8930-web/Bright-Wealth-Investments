<!DOCTYPE html>
<html>

<head>
    <title>Investment Demo Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .demo {
            background: #fff3cd;
            color: #664d03;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #111;
            color: white;
            padding: 13px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
        }

        .login-button:hover {
            background: #333;
        }

        .note {
            font-size: 13px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Investment Demo</h1>

        <div class="demo">
            DEMO ONLY — NO REAL MONEY
        </div>

        <h2>Login</h2>

        <form>

            <input type="email" placeholder="Enter email">

            <input type="password" placeholder="Enter password">

            <a href="dashboard.html" class="login-button">
                Login
            </a>

        </form>

        <p class="note">
            This is a demonstration website. No real accounts or funds are used.
        </p>

    </div>

</body>

</html>
